name: CI

# The Expo app had no CI at all. Two PRs shipped in one day verified only by a
# hand-run `tsc`, and one of them contained a bug that a typecheck did catch --
# but only because someone happened to run it. This makes that automatic.
#
# Docs-only changes are skipped, matching the API repo's workflow, so a README
# edit does not spend three minutes of runner time.

on:
  pull_request:
    branches: [dev, main, stage, prod]
    paths-ignore: ["**.md", "docs/**"]
  push:
    # `stage` and `prod` are here because pushing to them ships: each one has an
    # EAS workflow that builds and submits to TestFlight and Play. They were
    # absent, so the two branches that reach real testers were the two nothing
    # checked.
    #
    # The EAS workflows now verify for themselves as well — see
    # `.eas/workflows/`. That is the gate that cannot be bypassed; this is the
    # one that reports in the pull request, before the merge rather than after.
    branches: [dev, stage, prod]
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Named for what it runs. It has run the test suite since the suite existed
    # and said "typecheck + lint" on the pull request page the whole time, so
    # the one check people looked at under-reported itself.
    name: typecheck + test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 24, matching `deploy-ios.yml`. This said 20 while the workflow that
          # actually builds the app said 24 — so CI verified the code on a Node
          # major the release never runs on, and Node 20 is past end of life.
          # A green check on a runtime nothing ships with is worth very little.
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck against baseline
        # Passes on the known errors, fails on any new one. See
        # scripts/typecheck.sh for why this is not a bare `tsc --noEmit`.
        run: ./scripts/typecheck.sh

      - name: Test
        # A gate from its first run, unlike lint below. There is no backlog to
        # burn down — the suite starts at zero failures, so anything red is
        # something this PR did.
        run: npm test -- --ci

      - name: Lint
        # A gate now. The backlog it was waiting on is measured and empty:
        # `expo lint` reports 0 errors, and the ~79 warnings are style notes
        # that do not fail a run.
        #
        # The API repo learned this one the expensive way — three merges went
        # red there on unused imports that `tsc` and `jest` both pass, because
        # its lint *was* a gate and nobody ran it locally first. Here the
        # failure was quieter: a warning nobody reads is a check nobody has.
        run: npx expo lint
