name: CI

# The Expo app had no CI at all. Two PRs shipped in one day verified only by a
# hand-run `tsc`, and one of them contained a bug that a typecheck did catch --
# but only because someone happened to run it. This makes that automatic.
#
# Docs-only changes are skipped, matching the API repo's workflow, so a README
# edit does not spend three minutes of runner time.

on:
  pull_request:
    branches: [dev, main]
    paths-ignore: ["**.md", "docs/**"]
  push:
    branches: [dev]
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck against baseline
        # Passes on the known errors, fails on any new one. See
        # scripts/typecheck.sh for why this is not a bare `tsc --noEmit`.
        run: ./scripts/typecheck.sh

      - name: Test
        # A gate from its first run, unlike lint below. There is no backlog to
        # burn down — the suite starts at zero failures, so anything red is
        # something this PR did.
        run: npm test -- --ci

      - name: Lint
        # Not a gate yet: this repo has never been linted in CI, so the backlog
        # is unmeasured. Reported so the size is visible, and tightened to a
        # gate once it is known and burned down.
        run: npx expo lint || echo "::warning::lint reported issues (non-blocking for now)"
