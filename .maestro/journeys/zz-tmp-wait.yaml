appId: com.matryxsociallabs.blendn
---
- launchApp
- extendedWaitUntil:
    visible: ".*(Continue with email|The Pulse).*"
    timeout: 60000
- runFlow:
    when:
      visible: "Continue with email"
    file: ../subflows/sign-in.yaml
    env:
      PASSWORD: ${MAESTRO_PASSWORD}
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "The Pulse"
    timeout: 60000
- runFlow: ../subflows/dismiss-tip.yaml
- tapOn: "Me"
- tapOn: "Crews"
- extendedWaitUntil:
    visible: "Lot S9.*"
    timeout: 20000
- tapOn:
    text: "Make a crew"
    index: 0
- extendedWaitUntil:
    visible: "Crew name"
    timeout: 20000
- tapOn:
    id: "crew-name"
- inputText: "Wait S9"
- runFlow: ../subflows/keyboard-done.yaml
- scrollUntilVisible:
    element: "Make the crew"
    direction: DOWN
- tapOn: "I understand.*"
# C1: consent ticked but no friend picked — Make stays off.
- assertVisible:
    text: "Make the crew"
    enabled: false
- scrollUntilVisible:
    element: "Ask Ishan"
    direction: UP
- tapOn: "Ask Ishan"
- scrollUntilVisible:
    element: "Make the crew"
    direction: DOWN
- tapOn: "Make the crew"
- extendedWaitUntil:
    visible: "Asked 1 friend"
    timeout: 20000
- assertVisible: "Crew of 1 until a friend accepts"
- takeScreenshot: p2-wait-made
- tapOn: "Go back"
- extendedWaitUntil:
    visible: "Lot S9.*"
    timeout: 20000
- tapOn: "Lot S9.*"
- extendedWaitUntil:
    visible: "Invite friends"
    timeout: 20000
- scrollUntilVisible:
    element: "Invite friends"
    direction: DOWN
- tapOn: "Invite friends"
# M5: Ishan is already in Lot S9 — only Kiran is offered.
- extendedWaitUntil:
    visible: "Ask Kiran"
    timeout: 20000
- assertNotVisible: "Ask Ishan"
- takeScreenshot: p2-picker
