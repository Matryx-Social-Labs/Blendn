appId: com.matryxsociallabs.blendn
---
- assertVisible: "You liked ${THEIR_CREW}"
- takeScreenshot: c21-liked
- runScript:
    file: ../scripts/crew-like-back.js
    env:
      API: ${API}
      TOKEN: ${MAESTRO_THEIR_TOKEN}
      EVENT_ID: ${EVENT_ID}
      LIKE_CREW: ${MY_CREW}
- tapOn: "Close Blend'n"
- tapOn: "Banter"
# Live now lists the Blend from GET /chat/groups rooms: "Blend · <both crews>".
- extendedWaitUntil:
    visible: ".*Blend · .*${THEIR_CREW}.*"
    timeout: 30000
- takeScreenshot: c21-banter-live-now
- tapOn: ".*Blend · .*${THEIR_CREW}.*"
- extendedWaitUntil:
    visible: ".*Share your thoughts.*"
    timeout: 20000
- tapOn: ".*Share your thoughts.*"
- inputText: ${MESSAGE}
- tapOn:
    text: "Send"
    optional: true
- extendedWaitUntil:
    visible: ".*Share your thoughts.*"
    timeout: 15000
- assertVisible: ".*${MESSAGE}.*"
# The room's (i): the Blend's people — tonight's pseudonyms, nobody named yet.
- tapOn: "Room info"
- extendedWaitUntil:
    visible: "Open the chat"
    timeout: 20000
- assertNotVisible: ".*${REVEALED_NAME}.*"
- assertNotVisible: ".*${ANON_NAME}.*"
# Your own side is a count and you — never a tile per crewmate.
- assertVisible: "You and .* of your crew here"
- takeScreenshot: c21-menagerie
- scrollUntilVisible:
    element: "Reveal our crew"
    direction: DOWN
- tapOn: "Reveal our crew"
- tapOn: "Reveal"
# No count comes back about your own crew: one line.
- extendedWaitUntil:
    visible: "Your crew is revealed in this Blend.*"
    timeout: 20000
- runScript:
    file: ../scripts/blend-reveal.js
    env:
      API: ${API}
      TOKEN: ${MAESTRO_THEIR_TOKEN}
      BLEND_ID: ${output.blendId}
# Pull to refresh: their reveal arrives with GET /blends. The member who kept
# themselves anonymous stays a pseudonym tile (CR-I11).
- scrollUntilVisible:
    element: "Open the chat"
    direction: UP
- swipe:
    start: "50%, 30%"
    end: "50%, 80%"
- extendedWaitUntil:
    visible: ".*${REVEALED_NAME}.*"
    timeout: 20000
- assertNotVisible: ".*${ANON_NAME}.*"
- assertVisible: ".*keeps it private.*"
- takeScreenshot: c21-revealed
