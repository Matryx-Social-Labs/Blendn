# Flow 5 · the room (R-A, C1b): one room, People | Chat tabs, over the tabs.
#   disc → People → Chat → send, long-press, reply, sender card → Back: People → close;
#   a push-shaped link (chat/<id>) → Chat; the event page → Chat → close → the event page.
# Needs: checked in at a live event whose room has a message from somebody else in it (THEIRS, by SENDER).
# Env: MAESTRO_EMAIL, MAESTRO_PASSWORD (environment variables; delete ~/.maestro/tests/<run> afterwards). With -e:
#   CHAT_ID     the live room's chat group id, and EVENT_ID its event's: a push carries both
#   EVENT       a regex for the event's title in the room bar
#   THEIRS      a regex for another person's message as the feed labels it (".*<text>.*": the label is "<name>, <text>, <time>")
#   SENDER      their pseudonym as the room shows it, e.g. "Cosmic Panda"
#   MESSAGE     unique per run
#   SEND_POINT  the Send button with the keyboard up: `tapOn: "Send"` by label leaves the text unsent
#               (iOS 402×874: "358,537"; Android 1080×2400: "964,1422")
# Read back (blendn-admin):
#   npm run -s qa sq "SELECT m.content, m.parent_id IS NOT NULL AS is_reply FROM chat_messages m JOIN \"User\" u ON u.id = m.user_id WHERE u.email = '<email>' AND m.content LIKE '<MESSAGE>%' ORDER BY m.created_at"
#   Two rows: MESSAGE (is_reply false) and "<MESSAGE> · reply" (is_reply true).
appId: com.matryxsociallabs.blendn
tags:
  - flow-5
  - needs-live-event
---
- launchApp
- extendedWaitUntil:
    visible: "(Continue with email|Pulse)"
    timeout: 60000
- runFlow:
    when:
      visible: "Continue with email"
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${MAESTRO_EMAIL}
      PASSWORD: ${MAESTRO_PASSWORD}
- tapOn:
    text: "Not Now"
    optional: true
- runFlow: ../subflows/dismiss-tip.yaml

# --- The disc opens People ---
- tapOn:
    id: "disc"
- extendedWaitUntil:
    visible: "Everyone (here|who came).*"
    timeout: 20000
# The room's first-run coach mark, once ever.
- tapOn:
    text: "Got it"
    optional: true
- assertVisible:
    id: "room-bar"
- assertVisible: "The room, ${EVENT}"
- takeScreenshot: flow5-02-people

# --- Chat: the composer, then a send ---
- tapOn:
    id: "room-tab-chat-word"
- extendedWaitUntil:
    visible: ".*Say something to the room"
    timeout: 20000
- tapOn: ".*Say something to the room"
- inputText: ${MESSAGE}
# The keyboard must be all the way up, or the point is not the button yet.
- waitForAnimationToEnd
- tapOn:
    point: ${SEND_POINT}
# Sent: the field is empty again (the bubble's own text would match the field's too).
- extendedWaitUntil:
    visible: ".*Say something to the room"
    timeout: 15000
- assertVisible: ".*${MESSAGE}.*"
- hideKeyboard
- takeScreenshot: flow5-02-sent

# --- Long-press theirs: the reaction bar and the menu ---
- longPressOn: ${THEIRS}
- extendedWaitUntil:
    visible: "Reply"
    timeout: 5000
- assertVisible: "Copy"
- assertVisible: "Report…"
- takeScreenshot: flow5-02-menu
- tapOn: "Reply"
- extendedWaitUntil:
    visible: "Replying to .*"
    timeout: 5000
- tapOn: ".*Say something to the room"
- inputText: "${MESSAGE} · reply"
- waitForAnimationToEnd
- tapOn:
    point: ${SEND_POINT}
- extendedWaitUntil:
    visible: ".*Say something to the room"
    timeout: 15000
- extendedWaitUntil:
    visible: ".*${MESSAGE} · reply.*"
    timeout: 15000
- hideKeyboard

# --- Tap the sender: their card ---
- tapOn: ${SENDER}
- extendedWaitUntil:
    visible: "View profile"
    timeout: 10000
- tapOn: "Dismiss"

# --- Back: Chat → People → closed (Android's Back; on iOS the People tab) ---
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "room-tab-people-word"
- extendedWaitUntil:
    visible: "Everyone (here|who came).*"
    timeout: 10000
- tapOn:
    id: "room-close"
- extendedWaitUntil:
    notVisible:
      id: "room-bar"
    timeout: 10000

# --- A push-shaped link lands on Chat ---
- openLink: exp+blendn://chat/${CHAT_ID}?eventId=${EVENT_ID}
- extendedWaitUntil:
    visible: ".*Say something to the room"
    timeout: 30000
- assertVisible:
    id: "room-bar"
- takeScreenshot: flow5-02-link-chat
- tapOn:
    id: "room-close"

# --- The event page opens Chat, and closing goes back to the event page ---
- openLink: exp+blendn://event/${EVENT_ID}
# Checked in, the page's door reads "Open the room" beside "Check out": wait for it to settle, or the tap lands on Check out.
- extendedWaitUntil:
    visible: "Open the room"
    timeout: 30000
- waitForAnimationToEnd
- tapOn: "Open the room"
- extendedWaitUntil:
    visible: ".*Say something to the room"
    timeout: 30000
- tapOn:
    id: "room-close"
- extendedWaitUntil:
    visible: "Open the room"
    timeout: 15000
- takeScreenshot: flow5-02-back-on-event
