# Flow 5 · the room (feat(flow-5)): send; long-press someone's message →
# react, copy, reply; swipe it to reply; tap its sender → their card.
# Needs: checked in at a live event whose room has a message from somebody
# else in it (THEIRS, by SENDER).
# Env: MAESTRO_EMAIL, MAESTRO_PASSWORD (environment variables; delete
# ~/.maestro/tests/<run> afterwards). With -e:
#   ROOM     a regex for the room's title in the Banter
#   THEIRS   a regex for another person's message text in the room
#   SENDER   their pseudonym as the room shows it, e.g. "Cosmic Panda"
#   MESSAGE  unique per run
# Read back (blendn-admin):
#   npm run -s qa sq "SELECT m.content, m.parent_id IS NOT NULL AS is_reply, m.created_at::text AS at FROM chat_messages m JOIN \"User\" u ON u.id = m.user_id WHERE u.email = '<email>' AND m.content LIKE '<MESSAGE>%' ORDER BY m.created_at"
#   Two rows: MESSAGE (is_reply false) and "<MESSAGE> · reply" (is_reply true).
#   npm run -s qa sq "SELECT r.emoji FROM message_reactions r JOIN \"User\" u ON u.id = r.user_id WHERE u.email = '<email>' ORDER BY r.created_at DESC LIMIT 1"   →  ❤️
appId: com.matryxsociallabs.blendn
tags:
  - flow-5
  - needs-live-event
---
- runFlow: ../subflows/flow5-open.yaml
- scrollUntilVisible:
    element: ${ROOM}
    direction: DOWN
    timeout: 20000
- tapOn: ${ROOM}
- extendedWaitUntil:
    visible: "Say something to the room"
    timeout: 20000

# --- Send: the composer empties and the bubble lands (#12) ---
- tapOn: "Say something to the room"
- inputText: ${MESSAGE}
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Say something to the room"
    timeout: 10000
- extendedWaitUntil:
    visible: ${MESSAGE}
    timeout: 10000
- takeScreenshot: flow5-02-sent

# --- Long-press theirs: the reaction bar, then their card, Reply, Copy, Report…, Block… (R3-D5 5.2) ---
- longPressOn: ${THEIRS}
- extendedWaitUntil:
    visible: "Reply"
    timeout: 5000
- assertVisible: "Copy"
- assertVisible: "Report…"
- assertVisible: "Block…"
- assertVisible: "React, heart"
- takeScreenshot: flow5-02-menu
- tapOn: "React, heart"
- extendedWaitUntil:
    visible: "heart, .*including you"
    timeout: 10000

# --- Copy: silent, the menu goes ---
- longPressOn: ${THEIRS}
- tapOn: "Copy"
- extendedWaitUntil:
    notVisible: "Report…"
    timeout: 5000

# --- Reply from the menu, then cancel it ---
- longPressOn: ${THEIRS}
- tapOn: "Reply"
- extendedWaitUntil:
    visible: "Replying to .*"
    timeout: 5000
- tapOn: "Cancel reply"

# --- Swipe right to reply (#35), and send the reply ---
- swipe:
    from:
      text: ${THEIRS}
    direction: RIGHT
- extendedWaitUntil:
    visible: "Replying to .*"
    timeout: 5000
- tapOn: "Say something to the room"
- inputText: "${MESSAGE} · reply"
- tapOn: "Send"
- extendedWaitUntil:
    visible: "${MESSAGE} · reply"
    timeout: 10000
- takeScreenshot: flow5-02-replied

# --- Tap the sender: their card (R3-D5 5.1) ---
- tapOn: ${SENDER}
- extendedWaitUntil:
    visible: "View profile"
    timeout: 10000
- takeScreenshot: flow5-02-card
- tapOn: "Dismiss"
