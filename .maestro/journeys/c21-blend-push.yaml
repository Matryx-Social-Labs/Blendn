# TQ-C20 · H2 (review of #369). A reply push into a Blend opens it as a Blend,
# not as an event's room; with nothing underneath, Back goes to the Banter.
# Driven on the iOS sim, 2026-10-10. The sim has no push token, so the push
# is delivered by hand:
#   1. grant notifications once: open blendn://onboarding/notifications and
#      tap "Turn on notifications" (writes push_enabled=true for the account);
#   2. put the app in the background (open Settings) — the app draws no
#      banner over itself;
#   3. start this flow, and run, every 3 s until it has tapped,
#      xcrun simctl push <udid> com.matryxsociallabs.blendn <payload.json>
#      with {"aps":{"alert":{"title":"<room>","body":"S9 push check"}},
#            "body":{"type":"group_message","chatGroupId":"<blend room>","kind":"blend","blendId":"<blend>"}}
#      (expo-notifications reads the data from "body"). Maestro starts slowly,
#      so the flow idles, then taps the banner by point — a tap on its text
#      does not open the app.
# Then stop pushing: the next banner covers the room's (i).
# Env: none. Needs: signed in, a member of the Blend in the payload.
appId: com.matryxsociallabs.blendn
tags:
  - tq-c20
  - crews
---
- extendedWaitUntil:
    visible: "never-on-screen"
    timeout: 30000
    optional: true
- tapOn:
    point: "50%,8%"
- extendedWaitUntil:
    visible: ".*Share your thoughts.*|This Blend has closed"
    timeout: 60000
- takeScreenshot: c21-push-opened
