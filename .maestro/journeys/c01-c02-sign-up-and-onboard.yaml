# TQ-C01 + TQ-C02 (SCRUM-221, SCRUM-222). A new person through sign-up and all
# eight onboarding steps, taking "Maybe later" on notifications AND location —
# the branch that once stored push_enabled = true for someone who said no.
#
# Env: NEW_NAME, NEW_EMAIL (qa.<tag>.<n>@blendn.app — a person your session
# owns), NEW_PASSWORD (a passphrase: the strength rule refuses common ones),
# AGE, DOB_DD, DOB_MM, DOB_YYYY — 18 or over: Blend'n is 18+ (SCRUM-330), so
# there is no minor path any more; an age under 18 stops at the form.
#
# Read back afterwards (npm run -s qa sq in blendn-admin):
#   SELECT onboarded, push_enabled, share_location, orientations FROM profiles
#     WHERE id = (SELECT id FROM "User" WHERE email = '<NEW_EMAIL>')
appId: com.matryxsociallabs.blendn
tags:
  - tq-c01
  - tq-c02
  - destructive
---
# clearState does not touch the iOS Keychain, where the session lives: without
# this the app opens signed in as whoever ran last (2026-10-01).
- runFlow:
    when:
      platform: iOS
    commands:
      - clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Continue with email"
    timeout: 60000
# The launch intro is still animating when the button first appears, and a
# tap then lands on nothing (2 of 4 cold launches, 2026-09-30, iOS sim).
- waitForAnimationToEnd:
    timeout: 8000
- tapOn: "Continue with email"
- runFlow:
    when:
      visible: "Continue with email"
    commands:
      - tapOn: "Continue with email"
- extendedWaitUntil:
    visible: "Create account"
    timeout: 20000
- tapOn:
    text: "Create account"
    index: 0
# The form since #323: Name, Email, Password, Age.
- tapOn: "What should we call you?"
- inputText: ${NEW_NAME}
- runFlow: ../subflows/field-done.yaml
- tapOn: "you@example.com"
- inputText: ${NEW_EMAIL}
- runFlow: ../subflows/field-done.yaml
- tapOn: "At least 12 characters"
- inputText: ${NEW_PASSWORD}
- runFlow: ../subflows/field-done.yaml
- tapOn: "You must be 18 or over"
- inputText: ${AGE}
# Age is a number pad. On iOS it has no return key and hideKeyboard cannot
# dismiss it, but its toolbar has "Go", which submits the form (2026-09-30).
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Go"
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow: ../subflows/keyboard-done.yaml
      - tapOn:
          text: "Create account"
          index: 1
          optional: true
- extendedWaitUntil:
    visible: "The basics"
    timeout: 45000
- takeScreenshot: c02-basics
- tapOn: "Woman"
# Day and month move focus on by themselves; the year's "Go" submits the step.
# On the iOS number pad the keyboard-done point is backspace, so tap "Go".
- tapOn: "DD"
- inputText: ${DOB_DD}
- inputText: ${DOB_MM}
- inputText: ${DOB_YYYY}
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Go"
- runFlow:
    when:
      platform: Android
    file: ../subflows/keyboard-done.yaml
- extendedWaitUntil:
    visible: "Turn on notifications"
    timeout: 20000
- takeScreenshot: c02-notifications
- tapOn: "Maybe later"
- extendedWaitUntil:
    visible: "Allow location"
    timeout: 20000
- takeScreenshot: c02-location
- tapOn: "Maybe later"
# Everyone who gets this far is an adult, and sees Orientation here.
- extendedWaitUntil:
    visible: "Orientation"
    timeout: 20000
- takeScreenshot: c02-preferences
- tapOn: "Straight"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Where you live"
    timeout: 20000
- takeScreenshot: c02-journey
# hideKeyboard cannot dismiss these on iOS (2026-10-01); tapping the section
# heading above the field does. Android not yet driven on this screen.
- tapOn: "Search city"
- inputText: "Bengaluru"
- tapOn: "Where you live"
- tapOn: "e.g. Product designer"
- inputText: "Product designer"
- tapOn: "Occupation"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "About me"
    timeout: 20000
- takeScreenshot: c02-details
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "Skip for now"
    timeout: 20000
- takeScreenshot: c02-media
- tapOn: "Skip for now"
- extendedWaitUntil:
    visible: "Edit my details"
    timeout: 20000
- takeScreenshot: c02-ready
- tapOn: "Start Blend'n"
# onboarded is true from here; the invite screen comes after it.
- extendedWaitUntil:
    visible: "Share my link"
    timeout: 30000
- takeScreenshot: c02-friends
- tapOn: "Maybe later"
- extendedWaitUntil:
    visible: "The Pulse"
    timeout: 30000
- takeScreenshot: c02-pulse
