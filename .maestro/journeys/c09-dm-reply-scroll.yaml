# TQ-C09 (SCRUM-409). Reply from older messages in a long DM: the sent reply
# must come into view and stay there, and a drag must put the keyboard away.
# Build 121 (driven 2026-09-28) left the reply below the composer: the send's
# own echo re-read the newest page and put it in place of the list, dropping
# the older page loaded above it, and the view jumped.
# Env: EMAIL, PASSWORD, PEER (a regex for the other person's name in the
# Banter), QUOTE (a regex for any message in the older page), MESSAGE.
appId: com.matryxsociallabs.blendn
tags:
  - tq-c09
---
- launchApp:
    clearState: true
# clearState keeps the iOS Keychain session: signed in already, or not.
- extendedWaitUntil:
    visible: ".*(Continue with email|The Pulse).*"
    timeout: 60000
- runFlow:
    when:
      visible: "Continue with email"
    file: ../subflows/sign-in.yaml
# iOS offers to save the password over the first screen.
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "The Pulse"
    timeout: 60000
- runFlow: ../subflows/dismiss-tip.yaml
- tapOn: "Banter"
- extendedWaitUntil:
    visible: ${PEER}
    timeout: 30000
- tapOn: ${PEER}
- extendedWaitUntil:
    visible: ".*Share your thoughts.*"
    timeout: 20000
# An older page above the newest, so a refresh that replaced the list whole
# would shrink it.
- repeat:
    while:
      notVisible: "Load older messages"
    times: 15
    commands:
      - swipe:
          start: 50%, 25%
          end: 50%, 85%
          duration: 300
- tapOn: "Load older messages"
- extendedWaitUntil:
    visible: ${QUOTE}
    timeout: 15000
- longPressOn: ${QUOTE}
- tapOn: "Reply"
- extendedWaitUntil:
    visible: ".*Replying to.*"
    timeout: 5000
- tapOn: ".*Share your thoughts.*"
- inputText: ${MESSAGE}
- tapOn: "Send"
- extendedWaitUntil:
    visible: ".*${MESSAGE}.*"
    timeout: 10000
# The echo's sync lands within a second or two; the reply must still be there.
- waitForAnimationToEnd:
    timeout: 4000
- assertVisible: ".*${MESSAGE}.*"
- takeScreenshot: c09-sent-in-view
# A drag through the conversation puts the keyboard away. From a fresh focus:
# straight after inputText, Maestro's drag on iOS 27 never reached the list
# (the same drag, next run, did).
- tapOn: ".*Share your thoughts.*"
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible: "Q"
- swipe:
    start: 20%, 20%
    end: 20%, 50%
    duration: 1500
- assertNotVisible: "Q"
- takeScreenshot: c09-keyboard-away
