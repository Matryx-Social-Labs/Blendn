# Me → Settings → Sign out, back to the entry screen.
appId: com.matryxsociallabs.blendn
---
- runFlow: dismiss-tip.yaml
# The tab reads "Me" (#323), and Settings is the last row, below the fold.
- tapOn: "Me"
- scrollUntilVisible:
    element: "Settings"
    direction: DOWN
    timeout: 20000
- tapOn: "Settings"
- scrollUntilVisible:
    element: ".*[Ss]ign out.*"
    direction: DOWN
    timeout: 15000
- tapOn: ".*[Ss]ign out.*"
# It asks first: "Sign out?" with Cancel / Sign out.
- extendedWaitUntil:
    visible: "Sign out?"
    timeout: 10000
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Continue with email"
    timeout: 30000
