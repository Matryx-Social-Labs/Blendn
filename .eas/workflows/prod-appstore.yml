# prod -> App Store Connect, against the production API.
#
# The build lands in App Store Connect and stops there. `eas submit` uploads a
# binary; it does not create a version, attach release notes, or submit for
# review -- those stay in App Store Connect, done by a person.
#
# That is deliberate rather than a gap. Releasing to the App Store is the one
# step where somebody should look at what is about to reach the public, and it
# is also where the App Privacy answers and the age rating get confirmed. The
# automation earns its keep by removing the mechanical part: no downloading an
# .ipa, no Transporter, no wondering which build is which.
#
# Play works the same way by design: `releaseStatus: draft` on the production
# track means the bundle is uploaded and nothing is rolled out. Somebody opens
# Play Console and decides. Without it, a merge to prod would push straight to
# every Android user, which is a far sharper edge than the iOS side has -- there
# is no review queue in between to catch a mistake.
#
# So: merge to prod and a build ends up waiting in each console for a person to
# release. How long that takes is a plan question, not a pipeline one -- on the
# free tier the low-priority queue can sit for 90+ minutes before a ~15 minute
# build starts. That is fine here precisely because nobody is watching it; see
# "How long a build actually takes" in docs/RELEASING.md.

name: prod -> App Store Connect + Play (draft)

on:
  push:
    branches: ['prod']

# Nothing builds until the suite is green.
#
# Both platforms used to fan out straight off the push, so a merge to this
# branch shipped to TestFlight and Play internal whatever the tests said. The
# GitHub workflow does not cover it either: `ci.yml` fires on pull requests into
# `dev` and pushes to `dev`, and a push to this branch matches neither.
#
# It runs here rather than being read off a GitHub check on purpose. A green
# check is a fact about *a commit*, and gating on one means trusting that the
# commit it describes is the commit about to be built — across two systems, one
# of which can be down. This runs on the same machine, against the same
# checkout, moments before the build.
jobs:
  verify:
    name: typecheck + test
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Typecheck against baseline
        run: ./scripts/typecheck.sh
      - name: Test
        run: npm test -- --ci

  build_ios:
    needs: [verify]
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  build_android:
    needs: [verify]
    type: build
    params:
      platform: android
      profile: production

  submit_android:
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production
