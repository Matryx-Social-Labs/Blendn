# stage -> TestFlight, against the staging API.
#
# This replaces the manual loop: build on EAS, download the .ipa, upload it by
# hand. Nothing here needs a GitHub secret -- the build runs on Expo's
# infrastructure and reads its environment from EAS, so the repository being
# public is not a factor, and making it private later changes nothing.
#
# The API the build talks to is decided by `environment: preview` on the
# `staging` profile in eas.json, which resolves EXPO_PUBLIC_API_BASE_URL to
# staging-api.blendn.app. It is not set here, on purpose: a URL in two places
# is a URL that will disagree with itself.
#
# `autoIncrement` is on the profile because both stores refuse a version they
# have already seen -- App Store Connect a build number, Play a versionCode --
# and staging and production share one app record on each. TestFlight and the
# App Store are the same app; a TestFlight build is one that has not been
# released. Play's `internal` track is the same idea.

name: stage -> TestFlight + Play internal

# No `on:` trigger, on purpose. GitHub starts this, from the `ship` job in
# `.github/workflows/ci.yml`, once `verify` has passed on the same commit that
# was pushed to `stage`, and it passes `--ref <that sha>`, so EAS builds exactly
# the commit GitHub tested.
#
# This workflow used to trigger itself on the push and run typecheck + test on
# an EAS worker first. On the free tier that meant waiting for a worker slot
# just to repeat what GitHub had already checked, and then waiting again for
# each build and each submit. The test gate is now GitHub's `verify` check on
# the `stage` commit: red means no build.
#
# The one way around it is by hand: `eas workflow:run` or a dashboard re-run
# skips GitHub. Use that to retry a commit that already passed, never to ship
# one that did not.
#
# The two platforms are independent chains on purpose: an iOS signing problem
# should not stop Android testers getting a build, and vice versa. They fan out
# in parallel and neither waits on the other.
jobs:
  build_ios:
    type: build
    params:
      platform: ios
      profile: staging

  submit_ios:
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: staging

  build_android:
    type: build
    params:
      platform: android
      profile: staging

  submit_android:
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: staging
